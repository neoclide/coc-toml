name: coc-toml test

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        editor: [nvim, vim]

    env:
      NODE_ENV: test
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out coc.nvim runtime
        uses: actions/checkout@v5
        with:
          repository: neoclide/coc.nvim
          ref: release
          path: .coc-test-runtime
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check format
        run: pnpm prettier

      - name: Type check
        run: pnpm typecheck

      - name: Install editors
        run: sudo apt-get update && sudo apt-get install -y neovim vim

      - name: Real Tombi integration tests
        env:
          COC_TEST_COC_PATH: ${{ github.workspace }}/.coc-test-runtime
        run: pnpm test:integration:${{ matrix.editor }}
